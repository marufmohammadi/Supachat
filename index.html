<!doctype html>
<html lang="en" style="background-color: #0b141a;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111b21" />
    <meta name="background-color" content="#0b141a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SupaChat" />
    <meta name="description" content="Secure real-time messaging application" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b141a;
        color: #e9edef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0b141a;
      }
      .app-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(0, 168, 132, 0.2);
        border-top-color: #00a884;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <title>SupaChat</title>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="app-spinner"></div>
        <div style="font-size: 14px; font-weight: 500; color: #8696a0; letter-spacing: 0.3px;">Loading SupaChat...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
