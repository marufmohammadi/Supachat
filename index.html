<!doctype html>
<html lang="en" style="background-color: #08131A;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08131A" />
    <meta name="background-color" content="#08131A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SupaChat" />
    <meta name="description" content="Secure real-time messaging application" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #08131A;
        color: #e9edef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .app-splash {
        position: fixed;
        inset: 0;
        background-color: #08131A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 3rem 1rem;
        z-index: 99999;
        user-select: none;
        overflow: hidden;
      }
      .splash-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 18rem;
        height: 18rem;
        background-color: rgba(0, 168, 132, 0.15);
        border-radius: 9999px;
        filter: blur(48px);
        pointer-events: none;
        animation: splashGlow 2s ease-in-out infinite;
      }
      .splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 10;
        animation: splashScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .logo-frame {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .logo-aura {
        position: absolute;
        inset: 0;
        background-color: rgba(0, 168, 132, 0.25);
        border-radius: 1.5rem;
        filter: blur(12px);
        transform: scale(1.1);
      }
      .logo-box {
        position: relative;
        width: 5rem;
        height: 5rem;
        background: linear-gradient(135deg, #1f2c34 0%, #111b21 100%);
        border: 1px solid rgba(0, 168, 132, 0.3);
        border-radius: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 35px rgba(0, 168, 132, 0.25);
        color: #00a884;
      }
      .brand-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.25em;
        margin: 0 0 0.375rem 0;
      }
      .brand-sub {
        font-size: 0.75rem;
        font-weight: 500;
        color: #9ca3af;
        letter-spacing: 0.05em;
        margin: 0;
      }
      .dot-loader {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      .dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 50%;
        background-color: #00a884;
      }
      .dot1 { animation: dotPulse 0.8s ease-in-out infinite 0s; }
      .dot2 { animation: dotPulse 0.8s ease-in-out infinite 0.16s; }
      .dot3 { animation: dotPulse 0.8s ease-in-out infinite 0.32s; }

      .splash-footer {
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .footer-from {
        font-size: 0.625rem;
        font-weight: 500;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }
      .footer-brand {
        font-size: 0.875rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.05em;
      }
      .footer-sub {
        font-size: 0.6875rem;
        color: #9ca3af;
        font-weight: 400;
        letter-spacing: 0.025em;
      }

      @keyframes splashScale {
        0% { opacity: 0; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splashGlow {
        0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(0.95); }
        50% { opacity: 0.75; transform: translate(-50%, -50%) scale(1.15); }
      }
      @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.75); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
    <title>SupaChat</title>
  </head>
  <body>
    <div id="root">
      <div class="app-splash">
        <div class="splash-glow"></div>
        <div style="height: 1rem;"></div>
        <div class="splash-center">
          <div class="logo-frame">
            <div class="logo-aura"></div>
            <div class="logo-box">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
          </div>
          <h1 class="brand-title">SUPACHAT</h1>
          <p class="brand-sub">Secure • Fast • Private</p>
          <div class="dot-loader">
            <div class="dot dot1"></div>
            <div class="dot dot2"></div>
            <div class="dot dot3"></div>
          </div>
        </div>
        <div class="splash-footer">
          <span class="footer-from">from</span>
          <span class="footer-brand">Mofinity</span>
          <span class="footer-sub">Infinite Innovation.</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
